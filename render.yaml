services:
  - type: web
    name: kargo-takip-pod
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PUBLIC_BASE_URL
        value: "https://kargo-takip-pod.onrender.com"
      - key: PUBLIC_TRACKING_WEB_URL
        value: "https://kargo-takip-pod.onrender.com/#/track"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: SUPABASE_STORAGE_BUCKET
        value: "pod-media"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
